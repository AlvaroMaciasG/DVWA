
name: DevSecOps Pipeline - DVWA (5 Etapas)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Gitleaks:
    name: 1. Detección de Secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escaneo con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Semgrep:
    name: 2. Análisis SAST (PHP)
    runs-on: ubuntu-latest
    continue-on-error:true
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Ejecución de Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/php"
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  Dependency-Check:
    name: 3. Análisis SCA (Dependencias)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DVWA-TFG'
          path: '.'
          format: 'HTML'
          args: >
            --enableExperimental

  Trivy:
    name: 4. Build Imagen y Escaneo (SCA/CVE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Escaneo de sistema de archivos con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  DAST-ZAP:
    name: 5. Análisis DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [Gitleaks, Semgrep, Dependency-Check, Trivy]
    steps:
      - name: Desplegar DVWA localmente para DAST
        run: |
          docker run -d -p 80:80 vulnerables/web-dvwa
          sleep 10
      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost/'
          fail_action: false
